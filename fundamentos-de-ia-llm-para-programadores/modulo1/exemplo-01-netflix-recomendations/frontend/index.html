<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./src/css/output.css" rel="stylesheet">
  <title>Recomendação de filmes</title>
</head>

<body class="p-2">
  <div class="flex flex-col gap-2">
    <h1 class="text-3xl text-indigo-500 font-bold underline">
      Netflix Recommendations
    </h1>

    <div class="flex flex-wrap items-start gap-2">
      <div class="flex gap-2">
        <button id="btn-movies"
          class="p-2 rounded text-white font-medium outline outline-1 outline-indigo-600 bg-indigo-500 hover:bg-indigo-600">
          Movies
        </button>
        <button id="btn-users"
          class="p-2 rounded text-white font-medium outline outline-1 outline-indigo-600 bg-indigo-500 hover:bg-indigo-600">
          List users
        </button>
        <button id="btn-users-watches"
          class="p-2 rounded text-white font-medium outline outline-1 outline-indigo-600 bg-indigo-500 hover:bg-indigo-600">
          List users watches
        </button>
        <button id="btn-training-model"
          class="p-2 rounded text-white font-medium outline outline-1 outline-indigo-600 bg-indigo-500 hover:bg-indigo-600">
          Training Model
        </button>
      </div>
      <div class="flex h-auto w-full min-w-0 max-w-full flex-col overflow-hidden rounded-sm border-2 md:w-full">
        <span class="shrink-0 bg-gray-200 p-2 text-gray-800 font-semibold leading-4 shadow-sm">Response
        </span>
        <pre id="response"
          class="min-h-0 min-w-0 flex-1 overflow-auto whitespace-pre-wrap break-words p-2 hover:bg-slate-50"></pre>
      </div>
    </div>
  </div>
</body>
<script src="./src/js/index.js"></script>

</html>
